name: 技能需求
description: 提议新增一个科研技能，或修改现有技能。
title: "[skill] "
labels: ["skill-request"]
body:
  - type: input
    id: workflow
    attributes:
      label: 科研工作流
      description: 这个技能要支持什么科研任务？
      placeholder: "例：审查学位论文某一章的引用合规"
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: 输入
      description: 技能需要用到哪些文件、提示词、API 或上下文？
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: 预期产出
      description: 技能应该产出什么？
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 验证方式
      description: 维护者如何确认技能可用？
    validations:
      required: false
